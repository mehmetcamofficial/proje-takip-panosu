<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proje Takip Panosu — Iglesias Tour Turkey</title>
<style>
  :root{
    --bg:#05070c; --panel:rgba(22,27,34,.55); --panel-2:rgba(255,255,255,.04); --border:rgba(255,255,255,.09);
    --text:#e8ecf3; --text-dim:#9aa4b2; --brand:#6c8cff; --brand-2:#9b7dff;
    --green:#3ecf8e; --yellow:#e8b339; --red:#e8555f; --gray:#6b7684;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; padding:32px 20px 100px;
    min-height:100vh; overflow-x:hidden; position:relative;
  }
  /* ---- immersive background: floating blurred blobs + starfield ---- */
  .bg-scene{position:fixed; inset:0; z-index:-2; overflow:hidden; pointer-events:none;}
  .blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; will-change:transform;}
  .blob-1{width:520px;height:520px; background:radial-gradient(circle at 30% 30%,#6c8cff,transparent 70%); top:-140px; left:-120px; animation:drift1 22s ease-in-out infinite;}
  .blob-2{width:460px;height:460px; background:radial-gradient(circle at 60% 40%,#9b7dff,transparent 70%); top:20%; right:-160px; animation:drift2 26s ease-in-out infinite;}
  .blob-3{width:420px;height:420px; background:radial-gradient(circle at 50% 50%,#3ecf8e,transparent 70%); bottom:-160px; left:20%; animation:drift3 30s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(60px,80px,0) scale(1.1);}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(-70px,50px,0) scale(1.05);}}
  @keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(50px,-60px,0) scale(1.12);}}
  .stars{position:absolute; inset:0; background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 10% 65%, rgba(255,255,255,.3), transparent);
    opacity:.5;}
  @media (prefers-reduced-motion: reduce){ .blob{animation:none !important;} html{scroll-behavior:auto;} }

  a{color:var(--brand);}
  .wrap{max-width:1160px;margin:0 auto; perspective:1400px;}
  header{margin-bottom:28px; text-align:left;}
  header h1{
    font-size:32px;margin:0 0 8px; font-weight:800; letter-spacing:-.01em;
    background:linear-gradient(120deg,#fff 10%,var(--brand) 55%,var(--brand-2) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(108,140,255,.25);
  }
  header .sub{color:var(--text-dim);font-size:14.5px;}
  .updated{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);
    margin-top:12px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);
    padding:6px 12px;border-radius:20px;
  }
  .updated .dot{width:7px;height:7px;border-radius:50%;background:var(--green); box-shadow:0 0 8px var(--green);}
  .alert{
    display:flex;gap:12px;align-items:flex-start;
    background:linear-gradient(180deg,rgba(232,85,95,.14),rgba(232,85,95,.05));
    border:1px solid rgba(232,85,95,.35);border-radius:16px;padding:16px 18px;margin:22px 0 32px;
    backdrop-filter:blur(14px); box-shadow:0 12px 30px -10px rgba(232,85,95,.25);
  }
  .alert .icon{font-size:19px;line-height:1;}
  .alert b{color:#ff8b92;}
  .alert p{margin:4px 0 0;color:var(--text-dim);font-size:13.5px;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:40px;}
  .card{
    position:relative; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:20px;
    text-decoration:none;color:inherit;display:block; backdrop-filter:blur(16px) saturate(160%);
    box-shadow:0 10px 30px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    transform-style:preserve-3d; will-change:transform; transition:transform .12s ease-out, box-shadow .2s ease-out, border-color .2s;
  }
  .card::before{
    content:""; position:absolute; inset:0; border-radius:18px; padding:1px; pointer-events:none;
    background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%), rgba(108,140,255,.35), transparent 45%);
    opacity:0; transition:opacity .25s;
  }
  .card:hover{border-color:rgba(108,140,255,.5); box-shadow:0 20px 45px -14px rgba(108,140,255,.35), inset 0 1px 0 rgba(255,255,255,.08);}
  .card:hover::before{opacity:1;}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px; transform:translateZ(24px);}
  .card h3{font-size:15.5px;margin:0; transform:translateZ(24px);}
  .card p.desc{font-size:12.5px;color:var(--text-dim);margin:6px 0 14px; transform:translateZ(16px);}
  .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .badge.green{background:rgba(62,207,142,.15);color:var(--green); box-shadow:0 0 12px -2px rgba(62,207,142,.5);}
  .badge.yellow{background:rgba(232,179,57,.15);color:var(--yellow); box-shadow:0 0 12px -2px rgba(232,179,57,.5);}
  .badge.red{background:rgba(232,85,95,.15);color:var(--red); box-shadow:0 0 12px -2px rgba(232,85,95,.5);}
  .badge.gray{background:rgba(107,118,132,.18);color:#aeb6c1;}
  .progress-row{display:flex;align-items:center;gap:8px; transform:translateZ(16px);}
  .progress-track{flex:1;height:6px;background:var(--panel-2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px; background-size:200% 100%; animation:shimmer 2.6s linear infinite;}
  @keyframes shimmer{0%{background-position:0% 0;}100%{background-position:200% 0;}}
  .progress-pct{font-size:11px;color:var(--text-dim);width:32px;text-align:right;}

  .proj-section{
    padding:30px 30px 34px;margin-top:36px;border-radius:20px;scroll-margin-top:20px;
    background:var(--panel); border:1px solid var(--border); backdrop-filter:blur(14px);
    box-shadow:0 14px 36px -18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .proj-head h2{font-size:21px;margin:0;}
  .proj-repo{font-size:11.5px;color:var(--text-dim);margin:6px 0 16px;}
  .proj-desc{font-size:13.5px;color:var(--text-dim);max-width:780px;margin:0 0 18px;}
  h3.section-title{
    font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:26px 0 12px;
    display:flex; align-items:center; gap:10px;
  }
  h3.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .kanban-col{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:14px; backdrop-filter:blur(6px);}
  .kanban-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .kanban-col h4 .count{background:rgba(255,255,255,.06);color:var(--text-dim);border-radius:10px;padding:1px 8px;font-size:11px;}
  .kanban-item{
    background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:9px;
    transition:transform .15s ease-out, background .15s, border-color .15s;
  }
  .kanban-item:hover{transform:translateY(-3px) translateZ(6px); background:rgba(255,255,255,.06); border-color:rgba(108,140,255,.4);}
  .kanban-item:last-child{margin-bottom:0;}
  .kanban-item .tag{display:inline-block;font-size:10px;color:var(--text-dim);background:rgba(255,255,255,.05);padding:1px 7px;border-radius:6px;margin-top:6px;}
  .col-done h4{color:var(--green);} .col-doing h4{color:var(--yellow);} .col-todo h4{color:var(--gray);}
  .empty-note{font-size:12.5px;color:var(--text-dim);font-style:italic;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:0 10px 10px;border-bottom:1px solid var(--border);}
  td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.02);}
  .sev{font-size:11px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap;}
  .sev.high{background:rgba(232,85,95,.15);color:var(--red); box-shadow:0 0 10px -3px rgba(232,85,95,.6);}
  .sev.med{background:rgba(232,179,57,.15);color:var(--yellow);}
  .sev.low{background:rgba(107,118,132,.18);color:#aeb6c1;}

  .matrix{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .matrix .m-item{
    background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:6px;
    transition:transform .15s ease-out, border-color .15s;
  }
  .matrix .m-item:hover{transform:translateY(-3px) translateZ(6px); border-color:rgba(108,140,255,.4);}
  .matrix .m-item .name{font-size:12.5px;color:var(--text-dim);}
  .matrix .m-item .stat{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .matrix .m-item .stat .dot{width:8px;height:8px;border-radius:50%;}

  .log{position:relative;padding-left:22px;}
  .log::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:linear-gradient(var(--border),transparent);}
  .log-entry{position:relative;padding-bottom:22px;}
  .log-entry:last-child{padding-bottom:0;}
  .log-entry::before{content:"";position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--brand); box-shadow:0 0 10px rgba(108,140,255,.6);}
  .log-date{font-size:11.5px;color:var(--text-dim);margin-bottom:3px;}
  .log-title{font-size:13.5px;font-weight:600;margin-bottom:3px;}
  .log-body{font-size:12.5px;color:var(--text-dim);}

  footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-dim);}
  #loading{color:var(--text-dim);font-size:13px;padding:40px 0;text-align:center;}

  @media (max-width:640px){
    .kanban{grid-template-columns:1fr;}
    .blob{filter:blur(50px);}
    header h1{font-size:26px;}
  }
</style>
</head>
<body>
<div class="bg-scene" aria-hidden="true">
  <div class="stars"></div>
  <div class="blob blob-1" data-depth="0.15"></div>
  <div class="blob blob-2" data-depth="0.25"></div>
  <div class="blob blob-3" data-depth="0.1"></div>
</div>
<div class="wrap">
  <header id="site-header"></header>
  <div id="banner"></div>
  <div class="grid-cards" id="overview-cards"></div>
  <div id="project-sections"><div id="loading">Yükleniyor…</div></div>
  <footer>
    Bu pano statik dosyalardır (<code>site.json</code> + <code>projects/*.json</code>). Güncellemek için ilgili JSON dosyasını düzenleyip GitHub'a push edin — GitHub Pages otomatik olarak yeniden yayınlar.
  </footer>
</div>

<script>
const STATUS_DOT = { green: "#3ecf8e", yellow: "#e8b339", red: "#e8555f", gray: "#6b7684" };
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAN_TILT = window.matchMedia && window.matchMedia("(pointer: fine)").matches && !REDUCE_MOTION;

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

/* ---- 3D tilt + spotlight interaction for elevated elements ---- */
function attachTilt(node, maxDeg) {
  if (!CAN_TILT) return;
  const deg = maxDeg || 8;
  node.addEventListener("mousemove", (e) => {
    const r = node.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;   // 0..1
    const py = (e.clientY - r.top) / r.height;   // 0..1
    const rx = (0.5 - py) * deg * 2;
    const ry = (px - 0.5) * deg * 2;
    node.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(6px)`;
    node.style.setProperty("--mx", (px * 100) + "%");
    node.style.setProperty("--my", (py * 100) + "%");
  });
  node.addEventListener("mouseleave", () => {
    node.style.transform = "perspective(900px) rotateX(0) rotateY(0) translateZ(0)";
  });
}

/* ---- parallax on scroll for background blobs ---- */
function initParallax() {
  if (REDUCE_MOTION) return;
  const blobs = Array.from(document.querySelectorAll(".blob"));
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      blobs.forEach(b => {
        const depth = parseFloat(b.dataset.depth || "0.15");
        b.style.marginTop = (-(y * depth)) + "px";
      });
      ticking = false;
    });
  }, { passive: true });
}

function renderHeader(site) {
  const header = document.getElementById("site-header");
  header.innerHTML = `
    <h1>${site.title}</h1>
    <div class="sub">${site.subtitle}</div>
    <div class="updated"><span class="dot"></span> Son güncelleme: ${site.updated}</div>
  `;
  if (site.banner) {
    document.getElementById("banner").innerHTML = `
      <div class="alert">
        <div class="icon">${site.banner.icon}</div>
        <div><b>${site.banner.title}</b><p>${site.banner.text}</p></div>
      </div>`;
  }
}

function renderOverviewCard(p) {
  const card = el("a", "card");
  card.href = "#proj-" + p.id;
  const grad = `linear-gradient(90deg, ${STATUS_DOT[p.statusColor]}, ${STATUS_DOT[p.statusColor]}cc)`;
  const progressHtml = (p.progress === null || p.progress === undefined)
    ? `<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:100%;background:${STATUS_DOT[p.statusColor]};opacity:.35;"></div></div><div class="progress-pct">—</div></div>`
    : `<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:${p.progress}%;background:${grad};"></div></div><div class="progress-pct">%${p.progress}</div></div>`;
  card.innerHTML = `
    <div class="top"><h3>${p.name}</h3><span class="badge ${p.statusColor}">${p.statusLabel}</span></div>
    <p class="desc">${p.desc}</p>
    ${progressHtml}
  `;
  attachTilt(card, 7);
  return card;
}

function renderKanban(phases) {
  const wrap = el("div", "kanban");
  const cols = [
    { key: "done", cls: "col-done", label: "✅ Tamamlandı" },
    { key: "doing", cls: "col-doing", label: "🔄 Yapılıyor / Kısmi" },
    { key: "todo", cls: "col-todo", label: "📋 Planlanan / Yapılmadı" }
  ];
  cols.forEach(c => {
    const items = phases[c.key] || [];
    const col = el("div", "kanban-col " + c.cls);
    col.innerHTML = `<h4>${c.label} <span class="count">${items.length}</span></h4>`;
    if (items.length === 0) {
      col.appendChild(el("div", "empty-note", "Henüz bir şey yok."));
    } else {
      items.forEach(it => {
        const item = el("div", "kanban-item", it.title + (it.tag ? `<span class="tag">${it.tag}</span>` : ""));
        col.appendChild(item);
      });
    }
    wrap.appendChild(col);
  });
  return wrap;
}

function renderIssues(issues) {
  if (!issues || issues.length === 0) return el("div", "empty-note", "Bilinen bir sorun kaydedilmemiş.");
  const table = el("table");
  table.innerHTML = `<thead><tr><th style="width:90px;">Önem</th><th>Sorun</th><th style="width:320px;">Not</th></tr></thead>`;
  const tbody = el("tbody");
  const sevLabel = { high: "Yüksek", med: "Orta", low: "Düşük" };
  issues.forEach(i => {
    const tr = el("tr", null, `<td><span class="sev ${i.severity}">${sevLabel[i.severity] || i.severity}</span></td><td>${i.title}</td><td>${i.note || ""}</td>`);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function renderMatrix(integrations) {
  if (!integrations || integrations.length === 0) return el("div", "empty-note", "Entegrasyon bilgisi henüz eklenmedi.");
  const wrap = el("div", "matrix");
  integrations.forEach(m => {
    const item = el("div", "m-item");
    item.innerHTML = `<div class="name">${m.name}</div><div class="stat"><span class="dot" style="background:${STATUS_DOT[m.status]}; box-shadow:0 0 8px ${STATUS_DOT[m.status]};"></span>${m.label}</div>`;
    wrap.appendChild(item);
  });
  return wrap;
}

function renderLog(changelog) {
  const wrap = el("div", "log");
  (changelog || []).forEach(c => {
    const entry = el("div", "log-entry");
    entry.innerHTML = `<div class="log-date">${c.date}</div><div class="log-title">${c.title}</div><div class="log-body">${c.body}</div>`;
    wrap.appendChild(entry);
  });
  return wrap;
}

function renderProjectSection(p) {
  const section = el("section", "proj-section");
  section.id = "proj-" + p.id;
  section.innerHTML = `
    <div class="proj-head">
      <h2>${p.name}</h2>
      <span class="badge ${p.statusColor}">${p.statusLabel}</span>
    </div>
    <div class="proj-repo">${p.repoNote || ""}</div>
    <p class="proj-desc">${p.desc}</p>
  `;
  section.appendChild(el("h3", "section-title", "Aşamalar"));
  section.appendChild(renderKanban(p.phases || {}));
  section.appendChild(el("h3", "section-title", "Bilinen Sorunlar / Riskler"));
  section.appendChild(renderIssues(p.issues));
  section.appendChild(el("h3", "section-title", "Entegrasyon Durumu"));
  section.appendChild(renderMatrix(p.integrations));
  section.appendChild(el("h3", "section-title", "Değişiklik Günlüğü"));
  section.appendChild(renderLog(p.changelog));
  return section;
}

async function main() {
  initParallax();
  const [site, manifest] = await Promise.all([
    fetch("site.json").then(r => r.json()),
    fetch("projects/manifest.json").then(r => r.json())
  ]);
  renderHeader(site);

  const projects = await Promise.all(manifest.map(f => fetch("projects/" + f).then(r => r.json())));

  const overview = document.getElementById("overview-cards");
  overview.innerHTML = "";
  projects.forEach(p => overview.appendChild(renderOverviewCard(p)));

  const sections = document.getElementById("project-sections");
  sections.innerHTML = "";
  projects.forEach(p => sections.appendChild(renderProjectSection(p)));
}

main().catch(err => {
  document.getElementById("project-sections").innerHTML =
    `<div id="loading">Veri yüklenemedi: ${err.message}. Bu sayfayı bir HTTP sunucusu üzerinden açtığınızdan emin olun (GitHub Pages veya <code>python -m http.server</code>) — dosya olarak (file://) doğrudan açmak fetch() isteklerini engeller.</div>`;
});
</script>
</body>
</html>
